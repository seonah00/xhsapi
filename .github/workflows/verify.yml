name: Verify
on:
  push:
    branches: ['codex/zen-deploy-validation', 'claude/vigilant-planck-61yogr', 'aside/shared-dictionary-validation']
  pull_request:
    branches: ['claude/vigilant-planck-61yogr']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_DATA_MODE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:db
      - name: Install Chromium and dependencies
        timeout-minutes: 5
        run: |
          # The hosted runner's Azure mirror has stalled on font downloads. Keep
          # Ubuntu's signed packages and use its official archive over HTTPS.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-xhs-download-timeouts
          pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            test-results/
            .tmp/e2e/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-library-ui
          path: test-results/student-library/
          if-no-files-found: ignore
